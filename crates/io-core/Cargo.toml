[package]
name = "io-core"
version = "0.1.0"
edition = "2024"
description = "General-purpose async I/O engine with local, HTTP and S3 backends"

[lib]
name = "io_core"
crate-type = ["rlib"]

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.13", features = ["rustls", "gzip", "socks", "stream"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
rayon = "1"
aws-config = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "http-1x"] }
aws-credential-types = "1"
httpdate = "1"

[dev-dependencies]
tempfile = "3"
