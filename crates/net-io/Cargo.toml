[package]
name = "net-io"
version = "0.1.0"
edition = "2024"
description = "HTTP/web I/O for literature sources and MinerU"

[lib]
name = "net_io"
crate-type = ["rlib"]

[dependencies]
pyo3 = { version = "0.30" }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
bytes = "1"
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "rustls", "gzip", "socks"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.26"
thiserror = "2"
url = "2"
pythonize = "0.30"
urlencoding = "2"
