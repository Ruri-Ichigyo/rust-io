[package]
name = "io-py"
version = "0.1.0"
edition = "2024"
description = "PyO3 bindings for the generic io-core engine"

[lib]
name = "io_py"
crate-type = ["rlib"]

[dependencies]
pyo3 = { version = "0.30" }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
io-core = { path = "../io-core" }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }
